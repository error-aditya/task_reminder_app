name : newtodo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'

# dependancies
dependencies:
  flutter:
    sdk: flutter


  # for database
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # for date and time
  intl: ^0.18.0
  timezone: ^0.9.4

  # notification
  flutter_local_notifications: ^13.0.0

  # storing information
  shared_preferences: ^2.0.15

  # speech regonizer
  speech_to_text: ^6.1.1


  # for location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  permission_handler: ^11.3.1

  # state management
  get: ^4.6.6
  get_storage: ^2.1.1

  # for UI
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6



dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  hive_generator: ^2.0.0

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/godo.png
    - assets/images/logo.png

